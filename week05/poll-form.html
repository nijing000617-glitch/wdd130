<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Page</title>
</head>

<body>

    <header>
        <h1>Page Title</h1>
    </header>

    <main>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required <label for="usermail">Email:</label>
            <input type="email" id="useremail" name="useremail required" </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <label for="brower">What is your favorite internet browser?</label>
                <select id="brower" name="browser">
                    <option value="Chrome">Chrome</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Edge">Edge</option>
                    <option value="Brave">Brave</option>
                    <option value="Other">Other</option>
                </select>
                <label for="pet">Do you have a household set?</label>
                <input type="checkbox" id="pet" name="pet">
                <label for="places">List the places you have lived:</label>
                <textarea id="places" name="places" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                <button type="summit">Summit Poll</button>
            </fieldset>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>

</html>
